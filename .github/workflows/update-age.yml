name: Update age on birthday

on:
  schedule:
    # yearly on April 5 at midnight Sofia time (UTC+3 → 21:00 UTC on April 4)
    - cron: '0 21 4 4 *'
  workflow_dispatch:

jobs:
  bump-age:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Calculate age
        id: calc
        uses: frdmn/age-calculator-action@v1.1
        with:
          date: '2004/04/05'  # ← your birth date

      - name: Update README
        run: |
          sed -i "s/🩷 A [0-9]\{1,3\}-year/🩷 A ${{ steps.calc.outputs.age }}-year/" README.md

      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: chore: bump age to ${{ steps.calc.outputs.age }}
          branch: main
          file_pattern: README.md
